name: Sync PyPI Release Metadata

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-metadata-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Validate catalog before sync
        id: before
        run: uv run scripts/checks.py

      - name: Fetch latest release info from PyPI
        id: metadata
        run: uv run scripts/latest_release.py

      - name: Validate updated catalog
        id: after
        run: uv run scripts/checks.py

      - name: Generate and check README
        id: readme
        run: |
          uv run scripts/readme.py
          git diff --check -- README.md

      - name: Create pull request if metadata changed
        id: publish
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(tools): sync latest PyPI release metadata'
          title: 'chore(tools): sync latest PyPI release metadata'
          body: 'Automated PyPI release metadata sync.'
          branch: chore/sync-pypi-release-metadata
          delete-branch: true
          add-paths: |
            tools.json
            README.md
          reviewers: carlosferreyra

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-sync-failure
          path: |
            checks.log
            tools.json
            README.md
          retention-days: 14
          if-no-files-found: ignore
