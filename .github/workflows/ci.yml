name: Catalog Validation

on:
  push:
    branches:
      - main
    paths:
      - 'tools.json'
      - 'README.md'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
      - 'template/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Validate tools.json schema
        run: uv run scripts/checks.py

      - name: Test tools via uvx
        id: test
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run scripts/test_clients.py --diff HEAD~1 --output output.log
          else
            uv run scripts/test_clients.py --all --output output.log
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: |
            checks.log
            output.log
          retention-days: 30

      - name: Remove logs from workspace
        if: always()
        run: rm -f checks.log output.log

      - name: Fail job if any tools failed
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Check generated README is current
        run: |
          uv run scripts/readme.py
          git diff --exit-code -- README.md
