name: Validate Catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools.json'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'template/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Validate catalog
        id: catalog
        run: uv run scripts/checks.py 2>&1 | tee validation.log

      - name: Test maintenance scripts
        id: tests
        run: |
          { uv run --with httpx python -m unittest discover -s tests -v; } 2>&1 | tee tests.log

      - name: Check README freshness
        id: readme
        run: |
          { uv run scripts/readme.py && git diff --exit-code -- README.md; } 2>&1 | tee readme.log

      - name: Summarize validation
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CATALOG_STATUS: ${{ steps.catalog.outcome }}
          TESTS_STATUS: ${{ steps.tests.outcome }}
          README_STATUS: ${{ steps.readme.outcome }}
        run: python3 scripts/actions_summary.py catalog

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-validation-failure
          path: |
            checks.log
            validation.log
            tests.log
            readme.log
          retention-days: 14
          if-no-files-found: ignore
